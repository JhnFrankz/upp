version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - unconvert
    - misspell
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
