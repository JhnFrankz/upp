schema: spec-driven

context: |
  Project: upp — cross-platform dev environment updater (Go binary, ~2800 LOC) that updates a dev
  environment (apt, brew, nvm/node, npm, pnpm, opencode, bun, gh, docker, go).
  Stack: Go 1.22, cobra CLI, TOML config; legacy Bash script (upp-legacy.sh) kept as fallback.
  Architecture: compiled binary with adapter pattern, platform detection, security/trust layer.
  Conventions: Go standard formatting, table-driven tests, cobra subcommands.
  Git repo on main, Phase 1-6 complete.
  SDD cycle complete: upp-evolution archived 2026-08-09.
  Docs: README.md, CONTRIBUTING.md (planned).
  Specs: 6 domains (command-interface, config-system, platform-detection, security-model, tool-adapter, ux-patterns).

testing:
  strict_tdd: false
  test_command: ""
  framework: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality:
    linter: shellcheck (not installed)
    type_checker: none
    formatter: none
  smoke_check: "bash -n upp-legacy.sh && ./upp-legacy.sh --list"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing single-file script patterns
      - Keep --check, --dry-run, --list, --only, --skip modes working
      - Preserve set -euo pipefail and Spanish output conventions
    tdd: false
    test_command: ""
    smoke_check: "bash -n upp-legacy.sh"
  verify:
    test_command: ""
    build_command: "bash -n upp-legacy.sh"
    smoke_check: "./upp-legacy.sh --list"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
