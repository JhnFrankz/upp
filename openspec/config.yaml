schema: spec-driven

context: |
  Project: upp — cross-platform dev environment updater (Go binary) that updates a dev
  environment (apt, brew, nvm/node, npm, pnpm, opencode, bun, gh, docker, go, winget,
  scoop) plus custom tools defined in TOML.
  Stack: Go 1.22, cobra CLI (github.com/spf13/cobra), TOML config
  (github.com/BurntSushi/toml). Entry point: cmd/upp/main.go.
  Architecture: compiled binary, package-per-layer layout under internal/:
  cli (cobra subcommands init/list/check/update/export/import), adapters (official
  per-tool adapters + registry + custom), config, output, platform detection,
  security/trust model, selfupdate.
  Build/release: Makefile (build, build-all cross-compile for linux/darwin/windows amd64+arm64,
  test, test-race, test-cover, vet, lint, fmt, tidy, smoke).
  Conventions: gofmt, table-driven tests, cobra subcommands.
  Legacy Bash script (upp-legacy.sh) has been REMOVED — Go is the only stack.
  Git repo on main. 14 changes archived in openspec/changes/archive/.
  Docs: README.md.
  Specs: 9 domains (command-interface, config-system, ci-workflow, platform-detection, security-model,
  tool-adapter, ux-patterns, self-update, release-process).

testing:
  strict_tdd: true
  test_command: "go test ./... -count=1"
  framework: go-test (stdlib testing + table-driven tests)
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  quality:
    linter: golangci-lint (falls back to go vet)
    type_checker: go vet
    formatter: gofmt -s -w
    race_detector: true
  smoke_check: "bash scripts/smoke-test.sh --skip-build"

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Go package layout and adapter pattern
      - Keep upp init/list/check/update/export/import and --ci/--dry-run/--only/--skip working
      - Add table-driven tests for any new behavior
    tdd: true
    test_command: "go test ./... -count=1"
    smoke_check: "bash scripts/smoke-test.sh --skip-build"
  verify:
    test_command: "go test ./... -count=1 -race"
    build_command: "go build ./..."
    smoke_check: "bash scripts/smoke-test.sh --skip-build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
