product_decisions:
  status: confirmed
  items:
    - id: PC1
      decision: confirmed
      choice: include_always_update_current
      question: "Should plan.Updates include PolicyAlwaysUpdate tools when UpdateAvailable == false (brew/bun in the interactive pending set)?"
      resolution: "Include them. The interactive path MUST consume engine.Plan as the single source of truth for the pending set, matching the archived application-engine design (design.md:123,234) where PolicyAlwaysUpdate is planned unconditionally. No TTY-specific exception may be introduced."
    - id: PC2
      decision: confirmed
      choice: distinct_deselected_status
      question: "How should deselected pending tools be represented in the report (StatusSkipped vs. a new deselected status)?"
      resolution: "Use a distinct report status for deselected pending tools, visible in the final summary and separate from the existing skipped/not-installed status. Do NOT silently drop them."
