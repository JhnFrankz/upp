research:
  request:
    - "Q1: In established multi-package-manager updaters (topgrade, native managers), is an always-update/self-refresh command executed when the tool is current, or skipped?"
    - "Q2: Documented behavior/cost of `brew update` (self-refresh) when nothing is outdated."
    - "Q3: Documented convention for mapping a multi-select selector's chosen items to stable machine identifiers rather than display labels."
