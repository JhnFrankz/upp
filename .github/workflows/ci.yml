# CI for upp — test, lint, and release.
# The release job builds assets on tag pushes (after test and lint pass) or
# manual dispatch, then publishes the GitHub Release idempotently on tag
# pushes only (scripts/publish-release.sh). Dispatch builds and uploads
# artifacts without creating a release.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per event+ref so a manual workflow_dispatch run does not
  # cancel (or get cancelled by) push/PR runs on the same ref, and vice
  # versa. Tag refs fall back to a ref-only group so a dispatch against a
  # tag serializes with the tag-push for the same tag (both queue, never
  # run the publish path concurrently; publish is idempotent only
  # sequentially).
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.ref || format('{0}-{1}', github.event_name, github.ref) }}
  # Tag pushes must never be cancelled mid-run: a release build interrupted
  # before the publish step leaves no release (the publish script is
  # idempotent only once the assets exist). Non-tag runs cancel their own
  # stale in-flight runs to save minutes when new commits land.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format gate
        run: test -z "$(gofmt -s -l .)"

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test ./... -count=1 -race

      - name: Build
        run: make build

      - name: Smoke test
        run: bash scripts/smoke-test.sh --skip-build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the version used for the local lint run in the
          # upp-polish change; keep in sync when bumping.
          # The action already runs `golangci-lint run`; args carry only
          # the package scope (a duplicated `run` word is parsed as a dir).
          version: v1.60.3
          args: ./...

      - name: Shellcheck
        run: shellcheck -S warning scripts/install.sh scripts/smoke-test.sh scripts/publish-release.sh

      - name: Actionlint
        # Pinned to the exact version used by the local `go run` gate so the
        # CI check and the local check can never disagree; bump deliberately
        # and verify locally first.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml

  release:
    name: Release assets
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true

      - name: Build release assets
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upp-dist
          path: dist/**
          if-no-files-found: error

      - name: Restore annotated tag object
        # checkout may materialize the pushed annotated tag as lightweight;
        # publish-release.sh needs the tag object for correct release notes.
        if: startsWith(github.ref, 'refs/tags/v')
        run: 'for _ in 1 2 3 4 5; do git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" && exit 0; sleep 2; done; echo "WARNING: could not restore annotated tag object; release notes may fall back to the commit message"; exit 1'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh publish
