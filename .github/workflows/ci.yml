# CI for upp — test, lint, and release asset building.
# The release job only builds and uploads artifacts; publishing a GitHub
# Release (tag + assets) is a manual, user-triggered step (see README).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Format gate
        run: test -z "$(gofmt -s -l .)"

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test ./... -count=1 -race

      - name: Build
        run: make build

      - name: Smoke test
        run: bash scripts/smoke-test.sh --skip-build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the version used for the local lint run in the
          # upp-polish change; keep in sync when bumping.
          # The action already runs `golangci-lint run`; args carry only
          # the package scope (a duplicated `run` word is parsed as a dir).
          version: v1.60.3
          args: ./...

  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Build release assets
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upp-dist
          path: dist/**
          if-no-files-found: error
